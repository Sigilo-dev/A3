appId: dev.sigilo.a3
productName: A3
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraFiles:
  - from: ../../LICENSE
    to: LICENSE.a3.txt
  - from: ../../node_modules/react/LICENSE
    to: licenses/react.txt
  - from: ../../node_modules/react-dom/LICENSE
    to: licenses/react-dom.txt
  - from: ../../node_modules/scheduler/LICENSE
    to: licenses/scheduler.txt
  - from: resources/image
    to: licenses/image-conversion
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/sharp-win32-x64/**/*
npmRebuild: false
win:
  target: dir
  executableName: A3
  signExecutable: false
publish: null
